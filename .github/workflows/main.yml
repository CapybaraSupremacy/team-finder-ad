name: TeamFinder CI

on:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: team_finder
          POSTGRES_PASSWORD: team_finder_pass
          POSTGRES_DB: team_finder
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff and run Django tests
        env:
          DJANGO_SECRET_KEY: ci-secret-key-not-for-production
          DJANGO_DEBUG: "True"
          POSTGRES_DB: team_finder
          POSTGRES_USER: team_finder
          POSTGRES_PASSWORD: team_finder_pass
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          TASK_VERSION: 1
        run: |
          python -m ruff check .
          pytest
